# Two jobs, mirroring the repo's own split.
#
# `engine` runs both suites with NO install step — that is deliberate, not an
# optimisation. The heart claims zero runtime dependencies on a bare Node 18;
# a CI job that cannot even run `npm install` (there is nothing to install) is
# that claim, checked on every push. If somebody adds a dependency to the
# heart, this job does not get slower — the tests that import the new package
# crash, loudly, on a runner that never ran npm.
#
# `brain` is the one directory that carries dependencies (agent/, behind
# `npm run brain`). It installs the lockfile, imports the strategist —
# which proves the LangChain tree still resolves and parses, with no API key
# and no .mq/ anywhere — and runs the runtime's own suite (agent/test.mjs):
# workers pausing on a question, resuming after a restart, cancelled, refused
# a click, all against a SCRIPTED model, so no key is needed there either.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
        exclude:
          - os: windows-latest
            node: 18
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: engine, cards, seams
        run: node bin/test.mjs
      - name: voice fingerprint
        run: node --test bin/voice-test.mjs
      - name: the cloud — a customer's engine on Supabase, against a database in memory
        run: node bin/cloud-test.mjs

  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install the one directory that has dependencies
        run: npm run brain
      - name: the strategist imports clean, keyless
        run: node -e "import('./agent/strategist.mjs').then(() => console.log('brain imports clean'))"
      # The quest Edge Function (Deno) has no Node host to fall back on: a module
      # that touches lib/fs.mjs while it is being imported fails the function at
      # boot. Taking Node 22's fallback away here is that view of it.
      - name: the cloud and Quest's own seat import clean with no filesystem host — the Edge Function's view
        run: node -e "delete process.getBuiltinModule; import('./lib/cloud.mjs').then(() => import('./skills/index.mjs')).then(() => import('./agent/quest.mjs')).then(() => console.log('imports clean with no host'))"
      - name: the runtime — workers, the question list, restart, cancel — on a scripted model
        run: node agent/test.mjs
